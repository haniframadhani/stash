services:
  weed-mini:
    image: chrislusf/seaweedfs
    container_name: weed-mini
    ports:
      - '8333:8333' # S3 endpoint
      - '8888:8888' # Filer UI
      - '9333:9333' # Master UI
      - '12535:12535' # Admin UI
    volumes:
      - weed-data:/data
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: my-bucket

volumes:
  weed-data:
