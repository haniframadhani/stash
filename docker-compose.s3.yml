# Storage for Stash development. The app runs on the host (`bun run dev`) and
# reaches the bucket through S3_ENDPOINT in .env (default http://localhost:8333).
name: s3-only

services:
  weed-mini:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data
    ports:
      - '8333:8333' # S3 endpoint
      - '8888:8888' # Filer UI
      - '9333:9333' # Master UI
      - '12535:12535' # Admin UI
    volumes:
      - weed-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9333/cluster/status']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: creates the bucket the app expects, then exits. Idempotent, so
  # `docker compose up -d` can run again without failing.
  bucket-init:
    image: chrislusf/seaweedfs:4.53
    depends_on:
      weed-mini:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    environment:
      S3_BUCKET: my-bucket
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=weed-mini:9333 2>/dev/null | grep -q "$$S3_BUCKET"; do
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=weed-mini:9333 || true
          sleep 1
        done
        echo "bucket $$S3_BUCKET ready"

  # MinIO is a drop-in alternative; uncomment both services, stop weed-mini,
  # and point S3_ENDPOINT at http://localhost:9000 (.env credentials below).
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ':9001'
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'
  #   environment:
  #     MINIO_ROOT_USER: admin
  #     MINIO_ROOT_PASSWORD: secret123
  #   volumes:
  #     - minio-data:/data
  # minio-init:
  #   image: minio/mc
  #   depends_on:
  #     - minio
  #   entrypoint: ['/bin/sh', '-c']
  #   command:
  #     - |
  #       until mc alias set local http://minio:9000 admin secret123; do sleep 1; done
  #       mc mb --ignore-existing local/my-bucket

volumes:
  weed-data:
  # minio-data:
